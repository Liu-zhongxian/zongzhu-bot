# Copy to xiaozhi-esp32-server/main/xiaozhi-server/data/.config.yaml.
# Replace 192.168.1.100 with this computer's reachable LAN IP.
server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  websocket: ws://192.168.1.100:8000/xiaozhi/v1/
  vision_explain: http://192.168.1.100:8003/mcp/vision/explain
  auth:
    enabled: true
    allowed_devices: []
selected_module:
  VAD: SileroVAD
  ASR: SherpaXASR
  LLM: BotOnly
  TTS: EdgeTTS
  Memory: nomem
  Intent: nointent
# 语音识别用 X-ASR（安装脚本会下载模型，约 174MB）。认错的词可以在这里补：
# asr_hotwords: [宗主, Grok, GitHub]        # 写了就整个替换默认热词
# asr_corrections: {宗主: [中主, 钟主]}      # 正确写法: [认错的写法]，写了就整个替换默认纠错表
# 默认值见 core/utils/asr_text.py
# 本机点歌（可选，默认关闭）：先运行 bash tools/local_music_setup.sh，再把 enabled 改成 true。
# 打开后"放周杰伦的晴天""暂停""下一首""音量调到三十"在这台电脑上执行，不经过 Bot；
# 还会给语音识别加上常见歌手、歌名的热词。go-music-dl 会监听所有网卡的 port。
local_music:
  enabled: false
  go_music_dl: ../../../local-music/go-music-dl/music-dl
  port: 18080
  mpv: ../../../local-music/mpv/mpv.app/Contents/MacOS/mpv
  socket: ../../../local-music/mpv.sock   # 路径不能超过约 100 字节（macOS 限制）
  # hotwords: [蔡健雅, 达尔文]             # 追加自己常点的歌手、歌名
LLM:
  BotOnly:
    type: bot_only
grok_bot:
  enabled: true
  config_file: ../../../private/grok-bot-webhook.json
# 中控网关（可选）：一句话先依次问本机技能，都不接再交给 agent；不写这一节就是下面的默认值。
# gateway:
#   skills: [local_music]   # 按顺序尝试；[] 表示不用本机技能
#   agent: grok_bot         # 其余的话交给谁；留空则交给上游的对话模型
#   progress_prompts: false # 等 AI 回复时语音报进度（30 秒、再 60 秒、之后每 120 秒），默认关
prompt: 你是宗主，用简洁自然的中文回答用户，适合语音播报。
wakeup_words: [你好宗主, 你好小智, 嘿你好呀]
enable_greeting: true
enable_wakeup_words_response_cache: true
end_prompt:
  enable: false
VAD:
  SileroVAD:
    min_silence_duration_ms: 1000  # 静音超过这么久算说完；700 时句中停顿会把一句话切成两次提交（2026-10-21）

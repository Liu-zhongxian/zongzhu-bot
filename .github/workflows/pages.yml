# Publishes the web flasher (web/ + firmware/ packages) to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: GitHub Actions.
name: Web flasher

on:
  push:
    branches: [main]
    paths: ["web/**", "firmware/**", "tools/build_web.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test page libraries
        working-directory: web
        run: npm test
      - name: Assemble site
        run: python3 tools/build_web.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

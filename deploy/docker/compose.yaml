# 宗主后端（G21）。在仓库根目录：
#   cp deploy/docker/env.example deploy/docker/.env   # 填上你自己的目录
#   docker compose -f deploy/docker/compose.yaml up -d --build
# 说明见 deploy/docker/README.md。
services:
  zongzhu:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: zongzhu-backend
    container_name: zongzhu-backend
    restart: unless-stopped  # 代替 Mac 上的开机自启：Docker 起来它就起来，退出了自动拉起
    ports:
      - "8000:8000"  # 板子的 WebSocket
      - "8003:8003"  # OTA、网关页面
      - "4399:4399"  # 小米音箱（不接音箱可以删掉这行）
    volumes:
      # 配置（.config.yaml）和网关记下的东西（页面设置、固件、唤醒词资源包）
      - ${ZONGZHU_DATA:?在 .env 里写 ZONGZHU_DATA}:/opt/zongzhu/server/data
      # 语音模型：Mac 上装好的后端的 models/ 目录（VAD、X-ASR，接音箱时还有唤醒词模型）
      - ${ZONGZHU_MODELS:?在 .env 里写 ZONGZHU_MODELS}:/opt/zongzhu/server/models:ro
      # 私人目录挂在和宿主机一样的路径：后端把回复文件的完整路径交给 Bot，Bot 在宿主机上写，
      # 两边路径必须一样；配置里写的 Webhook、音箱 token 路径也不用改
      - ${ZONGZHU_PRIVATE:?在 .env 里写 ZONGZHU_PRIVATE}:${ZONGZHU_PRIVATE}
      # 仓库（只读）：网关页面改板子唤醒词时从这里的 firmware/ 找资源包（配置 gateway.firmware_root）
      - ${ZONGZHU_REPO:?在 .env 里写 ZONGZHU_REPO}:${ZONGZHU_REPO}:ro
